name: Refresh card art

# Rebuilds art-fill.json (pictures for cards TCGdex has none for) once a month,
# so new sets and newly added pictures show up without anyone doing anything.
on:
  schedule:
    - cron: '23 4 2 * *'   # 04:23 UTC on the 2nd of every month
  workflow_dispatch:        # or run it by hand: Actions → Refresh card art → Run workflow

permissions:
  contents: write

concurrency:
  group: refresh-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild art-fill.json
        run: python3 tools/build_art.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- art-fill.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-fill.json
          git commit -m "Refresh card art (monthly)"
          git push
